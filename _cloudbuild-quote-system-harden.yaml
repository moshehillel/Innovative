steps:
  - name: 'node:24'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm install -g firebase-tools@15.22.4
        cd functions && npm ci
        cd ..
        firebase deploy --config=_firebase-deploy-nolint.json \
          --only=functions:processQuoteWorkflow,functions:rerunQuoteRates,functions:syncQuoteOutlookInboxes,functions:updateQuoteDetails,functions:quoteAdminPage,functions:quoteRulesChat,functions:getQuoteRules,functions:generateQuoteEmail,functions:approveQuoteEmail,functions:quoteDispatcherPage \
          --project=tai-invoice-automation --non-interactive
timeout: '2400s'
options:
  logging: CLOUD_LOGGING_ONLY
