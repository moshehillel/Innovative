[build]
  publish = "."

# Browser calls /fn/<function> on this site. Netlify forwards them to Cloud
# Functions, including the method, body, query string, and Authorization header.
[[redirects]]
  from = "/fn/*"
  to = "https://us-central1-tai-invoice-automation.cloudfunctions.net/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
