steps:
  - name: 'node:24'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm install -g firebase-tools@15.22.4
        cd functions && npm ci
        cd ..
        firebase deploy --config=_firebase-deploy-nolint.json --only=functions:processGmailQueue --project=tai-invoice-automation --non-interactive
        cd functions && node scripts/_requeue-rev-capital-6672-temp.js
timeout: '3600s'
options:
  logging: CLOUD_LOGGING_ONLY
