<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote — Dispatcher</title>
  <style>
    :root {
      --primary: #1f4fd8;
      --primary-dark: #153a9e;
      --primary-light: #eef2ff;
      --bg: #f0f4fa;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --border: #e2e8f0;
      --text: #1f2937;
      --text-secondary: #475569;
      --muted: #64748b;
      --success: #059669;
      --success-bg: #ecfdf5;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow: 0 4px 6px rgba(15, 23, 42, 0.04), 0 12px 24px rgba(15, 23, 42, 0.06);
      --radius: 12px;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 20px 48px;
      max-width: 1040px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--primary-dark);
      margin: 0 0 6px;
    }
    .meta { color: var(--muted); font-size: 0.9375rem; margin-bottom: 16px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }
    .lane {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .lane-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      background: var(--surface-muted);
      border-bottom: 1px solid transparent;
    }
    .lane.open .lane-head { border-bottom-color: var(--border); }
    .lane-head h2 {
      margin: 0;
      font-size: 1.0625rem;
      font-weight: 700;
      flex: 1;
    }
    .chevron {
      color: var(--muted);
      transition: transform 0.15s ease;
      font-size: 0.875rem;
    }
    .lane.open .chevron { transform: rotate(90deg); }
    .lane-body { display: none; padding: 16px 18px 20px; }
    .lane.open .lane-body { display: block; }
    .why {
      background: var(--primary-light);
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 0.8125rem;
      color: var(--primary-dark);
    }
    .why strong { display: block; margin-bottom: 4px; }
    .acc-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 10px 0 14px;
      font-size: 0.8125rem;
    }
    .acc-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .opt {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 8px;
      background: var(--surface-muted);
      align-items: start;
    }
    .opt:hover { border-color: #c7d2fe; background: var(--surface); }
    .opt.checked {
      border-color: var(--success);
      background: var(--success-bg);
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.12);
    }
    .opt input { margin-top: 4px; width: 16px; height: 16px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .tag {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #c7d2fe;
    }
    .price { font-size: 1rem; font-weight: 600; margin-top: 2px; }
    .sell { color: var(--success); }
    .warn {
      color: var(--warning);
      background: var(--warning-bg);
      font-size: 0.8125rem;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .draft {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-top: 24px;
      box-shadow: var(--shadow-sm);
    }
    .draft h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .draft textarea {
      width: 100%;
      min-height: 220px;
      font-family: inherit;
      font-size: 0.875rem;
      line-height: 1.55;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-muted);
      color: var(--text-secondary);
      resize: vertical;
    }
    button, .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.875rem;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.ghost, .btn.ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    button.ghost:hover {
      background: var(--primary-light);
      border-color: #c7d2fe;
      color: var(--primary-dark);
    }
    button.danger {
      background: var(--error);
    }
    button.danger:hover { background: #b91c1c; }
    button.success { background: var(--success); }
    button.success:hover { background: #047857; }
    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .msg.ok { background: var(--success-bg); color: var(--success); }
    .msg.err { background: var(--error-bg); color: var(--error); }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid #fcd34d;
    }
    .badge.sent { background: var(--success-bg); color: var(--success); border-color: #6ee7b7; }
    .badge.dismissed { background: var(--surface-muted); color: var(--muted); border-color: var(--border); }
    .badge.draft_ready { background: var(--primary-light); color: var(--primary-dark); border-color: #c7d2fe; }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      margin: -24px -20px;
      background:
        radial-gradient(ellipse 90% 70% at 50% -20%, rgba(31, 79, 216, 0.12), transparent),
        var(--bg);
    }
    .login {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px 32px;
      box-shadow: var(--shadow);
    }
    .login h2 {
      margin: 0 0 8px;
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
    }
    .login-desc { color: var(--muted); font-size: 0.9375rem; margin: 0 0 24px; }
    .login-form { text-align: left; display: grid; gap: 18px; }
    .login-form label {
      display: grid;
      gap: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9375rem;
      font-family: inherit;
    }
    .login-form input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(31, 79, 216, 0.15);
    }
    .btn-login {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px 20px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(31, 79, 216, 0.25);
    }
    .btn-login:hover { background: var(--primary-dark); }
    .login-links { margin: 16px 0 0; text-align: center; }
    .link-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.875rem;
      padding: 6px 10px;
      font-family: inherit;
      font-weight: 500;
      border-radius: 6px;
    }
    .link-btn:hover { background: var(--primary-light); }
    .login-msg { margin-top: 14px; font-size: 0.875rem; }
    .login-msg.ok { color: var(--success); background: var(--success-bg); padding: 10px 14px; border-radius: 8px; }
    .login-err {
      color: var(--error);
      background: var(--error-bg);
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .hidden { display: none !important; }
    .home-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .home-link:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      body { padding: 16px 16px 40px; }
      .login { padding: 32px 24px 28px; }
      .login-page { margin: -16px; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
  <section id="login-screen" class="login-page">
    <div class="login">
      <h2>Sign in to review quote</h2>
      <p class="login-desc">Use your dispatcher email and password.</p>
      <form id="login-form" class="login-form">
        <label>Email
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>Password
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-login">Sign in</button>
      </form>
      <p class="login-links">
        <button type="button" class="link-btn" id="btn-forgot">Forgot password?</button>
      </p>
      <p id="login-success" class="login-msg ok hidden"></p>
      <p id="login-error" class="login-err hidden"></p>
    </div>
  </section>

  <div id="app" class="hidden">
    <div style="margin-bottom:12px">
      <a class="home-link" id="home-link" href="#">← Back to dashboard</a>
    </div>
    <h1 id="title">Quote review</h1>
    <div class="meta">
      <span id="meta">Loading…</span>
      <span id="status-badge" class="badge" style="margin-left:8px"></span>
    </div>
    <div class="toolbar">
      <button type="button" id="btn-generate">Generate email</button>
      <button type="button" class="success" id="btn-approve" disabled>Approve email</button>
      <button type="button" class="danger ghost" id="btn-dismiss">Dismiss</button>
      <span style="flex:1"></span>
      <button type="button" class="ghost" id="btn-copy" disabled>Copy draft</button>
    </div>
    <div id="action-msg" class="msg hidden"></div>
    <div id="lanes"></div>
    <div class="draft">
      <h3>Customer email draft</h3>
      <p style="color:var(--muted);font-size:0.875rem;margin:0 0 12px">
        Check rates above, click Generate email, edit if needed, then Approve to send via your Outlook.
      </p>
      <textarea id="draft-text" placeholder="Generated email will appear here…"></textarea>
    </div>
  </div>

  <script src="__API_BASE__/quoteAuthClient?v=__AUTH_CLIENT_VERSION__"></script>
  <script>
    const TENANT_ID = "__TENANT_ID__";
    const QUOTE_ID = "__QUOTE_ID__";
    const DISPATCHER_ID = "__DISPATCHER_ID__";
    const TOKEN = "__TOKEN__";
    const API = "__API_BASE__";
    let quote = null;
    const selections = {};
    const laneAccessorials = {};
    let draftReady = false;
    const hasLegacyToken = DISPATCHER_ID && TOKEN;

    async function apiFetch(path, opts) {
      const headers = Object.assign(
          {"Content-Type": "application/json"},
          await QuoteAuth.authHeaders(),
          (opts && opts.headers) || {});
      let url = API + path;
      if (hasLegacyToken && path.indexOf("getQuoteDispatcherData") >= 0) {
        url += (path.indexOf("?") >= 0 ? "&" : "?") +
          "dispatcherId=" + encodeURIComponent(DISPATCHER_ID) +
          "&token=" + encodeURIComponent(TOKEN);
      }
      return fetch(url, Object.assign({}, opts || {}, {headers})).then((r) => r.json());
    }

    function showMsg(text, ok) {
      const el = document.getElementById("action-msg");
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
      el.classList.remove("hidden");
    }

    function collectSelections() {
      return (quote.lanes || []).map((lane) => ({
        laneKey: lane.laneKey,
        rateIds: selections[lane.laneKey] || [],
      }));
    }

    async function persistSelections() {
      try {
        await apiFetch("/saveQuoteSelections", {
          method: "POST",
          body: JSON.stringify({
            tenantId: TENANT_ID,
            quoteId: QUOTE_ID,
            selections: collectSelections(),
            dispatcherId: DISPATCHER_ID || undefined,
            token: TOKEN || undefined,
          }),
        });
      } catch (_) { /* non-fatal */ }
    }

    async function load() {
      const url = "/getQuoteDispatcherData?id=" +
        encodeURIComponent(QUOTE_ID) + "&tenantId=" + encodeURIComponent(TENANT_ID);
      const res = await apiFetch(url);
      if (!res.ok) {
        document.getElementById("meta").textContent = res.error || "Failed to load";
        return;
      }
      quote = res.quote;
      applyQuote(quote);
    }

    function applyQuote(q) {
      quote = q;
      document.getElementById("title").textContent = quote.batchQuoteId || "Quote";
      document.getElementById("meta").textContent =
        (quote.from || "") + " — " + (quote.subject || "");
      const badge = document.getElementById("status-badge");
      badge.textContent = quote.status || "";
      badge.className = "badge " + (quote.status || "");
      draftReady = quote.status === "draft_ready" || quote.status === "sent" ||
        !!(quote.customerEmailText);
      document.getElementById("draft-text").value =
        quote.customerEmailText || quote.customerDraftText || "";
      document.getElementById("btn-approve").disabled =
        !draftReady || quote.status === "sent" || quote.status === "dismissed";
      document.getElementById("btn-copy").disabled =
        !document.getElementById("draft-text").value;
      document.getElementById("btn-generate").disabled =
        quote.status === "sent" || quote.status === "dismissed";
      document.getElementById("btn-dismiss").disabled =
        quote.status === "sent" || quote.status === "dismissed";

      (quote.lanes || []).forEach((lane) => {
        selections[lane.laneKey] = (lane.selectedRateIds || []).slice();
        laneAccessorials[lane.laneKey] = (lane.accessorials || []).slice();
      });
      renderLanes();
    }

    function renderLanes() {
      const root = document.getElementById("lanes");
      root.innerHTML = "";
      const common = quote.commonAccessorials || [
        {code: "LFO", label: "Liftgate pickup"},
        {code: "LFD", label: "Liftgate delivery"},
        {code: "APD", label: "Appointment delivery"},
        {code: "LAD", label: "Limited access"},
        {code: "RSD", label: "Residential delivery"},
        {code: "NUD", label: "Nursing home delivery"},
        {code: "HOD", label: "Hotel delivery"},
      ];

      (quote.lanes || []).forEach((lane, idx) => {
        const div = document.createElement("div");
        div.className = "lane" + (idx === 0 ? " open" : "");
        const selected = new Set(selections[lane.laneKey] || []);
        const accSet = new Set(laneAccessorials[lane.laneKey] || lane.accessorials || []);

        let whyHtml = "";
        const why = lane.accessorialWhy || [];
        if ((lane.accessorials || []).length || why.length) {
          whyHtml = "<div class='why'><strong>Accessorials" +
            (lane.accessorialLabels ? ": " + esc(lane.accessorialLabels) : "") +
            "</strong>";
          if (why.length) {
            whyHtml += why.map((w) =>
              "• " + esc(w.name) + (w.notes ? " — " + esc(w.notes) : "")
            ).join("<br>");
          } else {
            whyHtml += "Applied from quote rules / address classification.";
          }
          whyHtml += "</div>";
        }

        let toggles = "<div class='acc-toggles'>";
        common.forEach((a) => {
          const checked = accSet.has(a.code) ? " checked" : "";
          toggles += "<label><input type='checkbox' data-acc='" + esc(a.code) +
            "' data-lane='" + esc(lane.laneKey) + "'" + checked + "> " +
            esc(a.label) + "</label>";
        });
        toggles += "</div>";
        toggles += "<button type='button' class='ghost btn-rerun' data-lane='" +
          esc(lane.laneKey) + "'>Rerun quote with these accessorials</button>";

        let optsHtml = "";
        if (lane.rateError) {
          optsHtml = "<div class='warn'>Rate error: " + esc(lane.rateError) + "</div>";
        }
        (lane.options || []).forEach((opt) => {
          const isChecked = selected.has(String(opt.rateId));
          optsHtml += `<label class="opt${isChecked ? " checked" : ""}">
            <input type="checkbox" data-lane="${esc(lane.laneKey)}" data-rate="${esc(opt.rateId)}"${isChecked ? " checked" : ""}>
            <div>
              <div class="tags">${(opt.tags||[]).map(t => '<span class="tag">'+esc(t)+'</span>').join("")}</div>
              <div><strong>${esc(opt.name||opt.SCAC)}</strong></div>
              <div class="price">Cost $${num(opt.cost)} · <span class="sell">Sell $${num(opt.sellRate)}</span> · ${opt.transitDays||"?"} days${opt.quoteNumber ? " · Q# " + esc(opt.quoteNumber) : ""}</div>
              ${opt.warnings ? '<div class="warn">'+esc(String(opt.warnings).slice(0,160))+'</div>' : ""}
            </div>
          </label>`;
        });
        if (!(lane.options || []).length && !lane.rateError) {
          optsHtml = "<p style='color:var(--muted);font-size:0.875rem'>No rates returned.</p>";
        }

        div.innerHTML =
          "<div class='lane-head'>" +
            "<span class='chevron'>▶</span>" +
            "<h2>" + esc(lane.label || lane.laneKey) + "</h2>" +
            "<span style='color:var(--muted);font-size:0.8125rem'>" +
              (lane.options || []).length + " rates · " +
              selected.size + " selected</span>" +
          "</div>" +
          "<div class='lane-body'>" + whyHtml +
            "<p style='margin:0 0 4px;font-size:0.8125rem;font-weight:600;color:var(--text-secondary)'>Accessorials for re-rate</p>" +
            toggles +
            "<p style='margin:18px 0 4px;font-size:0.8125rem;font-weight:600;color:var(--text-secondary)'>Cheapest rates (check to include in email)</p>" +
            optsHtml +
          "</div>";
        root.appendChild(div);
      });

      root.querySelectorAll(".lane-head").forEach((el) => {
        el.addEventListener("click", () => {
          el.parentElement.classList.toggle("open");
        });
      });

      root.querySelectorAll("input[data-rate]").forEach((input) => {
        input.addEventListener("change", () => {
          const laneKey = input.dataset.lane;
          const rateId = String(input.dataset.rate);
          const set = new Set(selections[laneKey] || []);
          if (input.checked) set.add(rateId);
          else set.delete(rateId);
          selections[laneKey] = [...set];
          input.closest(".opt").classList.toggle("checked", input.checked);
          const laneEl = input.closest(".lane");
          const headMeta = laneEl && laneEl.querySelector(".lane-head span:last-child");
          if (headMeta) {
            const lane = (quote.lanes || []).find((l) => l.laneKey === laneKey);
            headMeta.textContent =
              ((lane && lane.options) || []).length + " rates · " +
              set.size + " selected";
          }
          draftReady = false;
          document.getElementById("btn-approve").disabled = true;
          persistSelections();
        });
      });

      root.querySelectorAll("input[data-acc]").forEach((input) => {
        input.addEventListener("change", () => {
          const laneKey = input.dataset.lane;
          const code = input.dataset.acc;
          const set = new Set(laneAccessorials[laneKey] || []);
          if (input.checked) set.add(code);
          else set.delete(code);
          laneAccessorials[laneKey] = [...set];
        });
      });

      root.querySelectorAll(".btn-rerun").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const laneKey = btn.dataset.lane;
          btn.disabled = true;
          btn.textContent = "Re-rating…";
          try {
            const res = await apiFetch("/rerunQuoteRates", {
              method: "POST",
              body: JSON.stringify({
                tenantId: TENANT_ID,
                quoteId: QUOTE_ID,
                laneKey,
                accessorials: laneAccessorials[laneKey] || [],
                dispatcherId: DISPATCHER_ID || undefined,
                token: TOKEN || undefined,
              }),
            });
            if (!res.ok) throw new Error(res.error || "Rerun failed");
            applyQuote(res.quote);
            showMsg("Rates refreshed for this lane.", true);
          } catch (err) {
            showMsg(err.message || "Rerun failed", false);
            btn.disabled = false;
            btn.textContent = "Rerun quote with these accessorials";
          }
        });
      });
    }

    document.getElementById("btn-generate").addEventListener("click", async () => {
      const checked = collectSelections().some((s) => s.rateIds.length);
      if (!checked) {
        showMsg("Check at least one rate before generating the email.", false);
        return;
      }
      try {
        const res = await apiFetch("/generateQuoteEmail", {
          method: "POST",
          body: JSON.stringify({
            tenantId: TENANT_ID,
            quoteId: QUOTE_ID,
            selections: collectSelections(),
            style: "bullet",
            dispatcherId: DISPATCHER_ID || undefined,
            token: TOKEN || undefined,
          }),
        });
        if (!res.ok) throw new Error(res.error || "Generate failed");
        document.getElementById("draft-text").value = res.text || "";
        draftReady = true;
        document.getElementById("btn-approve").disabled = false;
        document.getElementById("btn-copy").disabled = false;
        document.getElementById("status-badge").textContent = "draft_ready";
        document.getElementById("status-badge").className = "badge draft_ready";
        showMsg("Email draft generated. Review, then Approve to send.", true);
      } catch (err) {
        showMsg(err.message || "Generate failed", false);
      }
    });

    document.getElementById("btn-approve").addEventListener("click", async () => {
      if (!confirm("Send this email to the customer via your connected Outlook?")) return;
      try {
        const res = await apiFetch("/approveQuoteEmail", {
          method: "POST",
          body: JSON.stringify({
            tenantId: TENANT_ID,
            quoteId: QUOTE_ID,
            bodyText: document.getElementById("draft-text").value,
            dispatcherId: DISPATCHER_ID || undefined,
            token: TOKEN || undefined,
          }),
        });
        if (!res.ok) throw new Error(res.error || "Send failed");
        document.getElementById("status-badge").textContent = "sent";
        document.getElementById("status-badge").className = "badge sent";
        document.getElementById("btn-approve").disabled = true;
        document.getElementById("btn-generate").disabled = true;
        document.getElementById("btn-dismiss").disabled = true;
        showMsg("Email sent to " + (res.to && res.to.join(", ")) + ".", true);
      } catch (err) {
        showMsg(err.message || "Send failed", false);
      }
    });

    document.getElementById("btn-dismiss").addEventListener("click", async () => {
      if (!confirm("Dismiss this quote? It will leave your pending list.")) return;
      try {
        const res = await apiFetch("/dismissQuote", {
          method: "POST",
          body: JSON.stringify({
            tenantId: TENANT_ID,
            quoteId: QUOTE_ID,
            dispatcherId: DISPATCHER_ID || undefined,
            token: TOKEN || undefined,
          }),
        });
        if (!res.ok) throw new Error(res.error || "Dismiss failed");
        document.getElementById("status-badge").textContent = "dismissed";
        document.getElementById("status-badge").className = "badge dismissed";
        document.getElementById("btn-approve").disabled = true;
        document.getElementById("btn-generate").disabled = true;
        document.getElementById("btn-dismiss").disabled = true;
        showMsg("Quote dismissed.", true);
      } catch (err) {
        showMsg(err.message || "Dismiss failed", false);
      }
    });

    document.getElementById("btn-copy").addEventListener("click", () => {
      navigator.clipboard.writeText(document.getElementById("draft-text").value);
      showMsg("Draft copied.", true);
    });

    document.getElementById("home-link").href =
      API + "/quoteDispatcherHomePage?tenantId=" + encodeURIComponent(TENANT_ID);

    function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
    function num(n) { const v = Number(n); return isFinite(v) ? v.toFixed(2) : "___"; }

    function showApp(show) {
      document.getElementById("login-screen").classList.toggle("hidden", show);
      document.getElementById("app").classList.toggle("hidden", !show);
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("login-error").textContent = "";
      document.getElementById("login-error").classList.add("hidden");
      document.getElementById("login-success").classList.add("hidden");
      try {
        await QuoteAuth.signInWithEmailPassword(
            document.getElementById("login-email").value,
            document.getElementById("login-password").value);
      } catch (err) {
        const errEl = document.getElementById("login-error");
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      }
    });

    document.getElementById("btn-forgot").addEventListener("click", async () => {
      document.getElementById("login-error").textContent = "";
      document.getElementById("login-error").classList.add("hidden");
      document.getElementById("login-success").classList.add("hidden");
      const email = document.getElementById("login-email").value;
      if (!email) {
        const errEl = document.getElementById("login-error");
        errEl.textContent = "Enter your email above, then click Forgot password.";
        errEl.classList.remove("hidden");
        document.getElementById("login-email").focus();
        return;
      }
      try {
        await QuoteAuth.sendPasswordResetEmail(email);
        document.getElementById("login-success").textContent =
          "Password reset email sent. Check your inbox.";
        document.getElementById("login-success").classList.remove("hidden");
      } catch (err) {
        const errEl = document.getElementById("login-error");
        errEl.textContent = err.message || "Could not send reset email";
        errEl.classList.remove("hidden");
      }
    });

    if (!QUOTE_ID) {
      document.getElementById("meta").textContent = "Missing quote id";
    } else if (hasLegacyToken) {
      showApp(true);
      load();
    } else {
      QuoteAuth.init({apiBase: API, tenantId: TENANT_ID}).then(() => {
        QuoteAuth.onAuth((user) => {
          if (!user) { showApp(false); return; }
          showApp(true);
          load();
        });
      }).catch((e) => {
        const errEl = document.getElementById("login-error");
        errEl.textContent = e.message;
        errEl.classList.remove("hidden");
      });
    }
  </script>
</body>
</html>
