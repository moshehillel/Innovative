<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login animation preview</title>
  <link rel="stylesheet" href="style.css?v=20261012a">
  <style>
    .preview-dash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #14212b;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }
    .preview-hud {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 300;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(7, 16, 24, 0.72);
      color: #f4f7fb;
      backdrop-filter: blur(8px);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .preview-hud p { margin: 0; font-size: 0.95rem; }
    .preview-hud button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #38bdf8;
      color: #082f49;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .preview-hud button:disabled { opacity: 0.65; cursor: default; }
  </style>
</head>
<body>
  <div id="dash" class="preview-dash">Dashboard</div>
  <div id="clip" class="login-highway-overlay" aria-hidden="true">
    <div class="login-highway-frame">
      <video id="clip-video" muted autoplay playsinline preload="auto">
        <source src="media/login-highway.webm?v=20261012a" type="video/webm">
        <source src="media/login-highway.mp4?v=20261012a" type="video/mp4">
      </video>
    </div>
  </div>
  <div class="preview-hud">
    <p>Preview only. Fade starts at the 4.25s turn, over 700ms. Motion pauses on that frame if the shell is late.</p>
    <button id="replay" type="button">Replay</button>
  </div>
  <script>
    var TURN_S = 4.25;
    var TURN_END_S = 5;
    var FADE_MS = 700;
    var clip = document.getElementById("clip");
    var video = document.getElementById("clip-video");
    var btn = document.getElementById("replay");
    var timer = null;
    var fading = false;
    var reduced = false;
    try {
      reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) { reduced = false; }

    function reveal() {
      if (fading) return;
      fading = true;
      clip.classList.add("is-fading");
      btn.disabled = false;
    }

    function play() {
      if (timer) clearTimeout(timer);
      btn.disabled = true;
      if (reduced) {
        clip.classList.add("is-fading");
        btn.disabled = false;
        return;
      }
      fading = false;
      clip.classList.remove("is-fading");
      video.loop = false;
      video.playbackRate = 0.85;
      video.currentTime = 0;
      var kick = video.play();
      if (kick && kick.then) kick.then(function () { video.playbackRate = 0.85; }).catch(function () {});
      else if (kick && kick.catch) kick.catch(function () {});
      var shellReady = true;
      function tick() {
        var t = video.currentTime || 0;
        if (t >= TURN_END_S) {
          try { video.pause(); } catch (e) {}
        }
        if ((t >= TURN_S || video.ended) && shellReady) reveal();
        if (!video.paused && t < TURN_END_S) timer = setTimeout(tick, 50);
      }
      timer = setTimeout(tick, 50);
    }

    btn.addEventListener("click", play);
    play();
  </script>
</body>
</html>
