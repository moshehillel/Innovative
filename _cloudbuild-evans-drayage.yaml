steps:
  - name: 'node:24'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        npm install -g firebase-tools@15.22.4
        cd functions && npm ci
        cd ..
        if [ -f functions/.env.tai-invoice-automation ]; then
          sed -i 's/^DASHBOARD_OPS_PRIMARY=.*/DASHBOARD_OPS_PRIMARY=false/' \
            functions/.env.tai-invoice-automation || true
        fi
        grep -n 'evans delivery' functions/drayage-intake.js | head
        grep -n 'Late drayage check before missing-load' functions/index.js | head
        firebase deploy --config=_firebase-deploy-nolint.json \
          --only=functions:processGmailQueue,functions:checkGmailInbox \
          --project=tai-invoice-automation --non-interactive --force
timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY
